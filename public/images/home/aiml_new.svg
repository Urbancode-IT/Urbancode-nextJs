<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Dynamic Gradient Background -->
  <defs>
    <linearGradient id="aimlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b5876" />
      <stop offset="100%" stop-color="#4e4376" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="45" fill="url(#aimlGrad)" />
  
  <!-- Subtle tech/brain nodes in the background -->
  <circle cx="50" cy="50" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="150" cy="60" r="5" fill="#ffffff" opacity="0.3"/>
  <circle cx="70" cy="150" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="140" cy="140" r="6" fill="#ffffff" opacity="0.3"/>
  <path d="M 50 50 L 150 60 L 140 140 L 70 150 Z" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.15" />

  <!-- Main Text -->
  <text x="100" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">AI</text>
  
  <!-- Divider -->
  <line x1="60" y1="105" x2="140" y2="105" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" />
  
  <!-- Sub Text -->
  <text x="100" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#00e5ff" text-anchor="middle" letter-spacing="4">ML</text>
</svg>
